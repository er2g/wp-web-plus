# Nginx vhost snippet for hosting this panel under:
#   https://ngix.rammfire.com/wp/
#
# Assumes the Node server listens on 127.0.0.1:3000 (see `PORT` in `.env`).
#
# Enable websockets for Socket.IO and strip the `/wp/` prefix before proxying.

server {
    listen 80;
    listen [::]:80;
    server_name ngix.rammfire.com;

    # Allow large payloads (the app accepts large JSON/media uploads).
    client_max_body_size 512m;

    # Ensure relative browser URLs like `fetch('api/...')` resolve correctly.
    location = /wp {
        return 301 /wp/;
    }

    location ^~ /wp/ {
        # Strip `/wp/` before proxying to the app (which is rooted at `/`).
        rewrite ^/wp/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO / WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Make app redirects work under `/wp/` (e.g. redirects to `/` -> `/wp/`).
        proxy_redirect ~^(/.*)$ /wp$1;

        # Keep session cookies scoped to this path (optional but recommended).
        proxy_cookie_path / /wp/;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://127.0.0.1:3000;
    }
}
