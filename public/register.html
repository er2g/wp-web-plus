<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Panel - Kayit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #128C7E 0%, #075E54 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
        }
        .logo {
            font-size: 60px;
            color: #25D366;
            margin-bottom: 20px;
        }
        .btn-whatsapp {
            background: #25D366;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
        }
        .btn-whatsapp:hover {
            background: #128C7E;
        }
        .helper {
            color: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="logo">
            <i class="bi bi-whatsapp"></i>
        </div>
        <h2 class="mb-2">WhatsApp Panel</h2>
        <p class="helper mb-4">Kayit olmak icin davet kodu gerekir.</p>
        <form id="registerForm">
            <div class="mb-3">
                <input type="text" class="form-control form-control-lg" id="inviteCode" placeholder="Davet Kodu (XXXX-XXXX-XXXX)" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control form-control-lg" id="username" placeholder="Kullanici adi" required>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control form-control-lg" id="password" placeholder="Sifre" required>
            </div>
            <div id="error" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-whatsapp btn-lg text-white w-100">
                <i class="bi bi-person-plus me-2"></i>Kayit Ol
            </button>
            <div class="mt-3 text-center">
                <a href="login.html">Zaten hesabim var</a>
            </div>
        </form>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inviteCode = document.getElementById('inviteCode').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const csrfToken = getCookie('XSRF-TOKEN');

            errorDiv.classList.add('d-none');
            errorDiv.textContent = '';

            try {
                const response = await fetch('auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-XSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({ username, password, inviteCode })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Kayit basarili! Giris sayfasina yonlendiriliyorsunuz.');
                    window.location.href = 'login.html';
                    return;
                }

                errorDiv.textContent = data.error || 'Kayit basarisiz';
                errorDiv.classList.remove('d-none');
            } catch (err) {
                errorDiv.textContent = 'Baglanti hatasi!';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
